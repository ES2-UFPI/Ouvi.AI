services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ouveai
      POSTGRES_PASSWORD: ouveai
      POSTGRES_DB: ouveai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: bitnamilegacy/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ouveai
      MINIO_ROOT_PASSWORD: ouveai123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - minio
    volumes:
      - ./backend:/app

volumes:
  pgdata:
  miniodata: