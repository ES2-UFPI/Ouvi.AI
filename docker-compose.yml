services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ouveai -d ouveai"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Imagem Bitnami (legacy): o entrypoint dela já inicia o servidor, por isso não há `command`
    image: bitnamilegacy/minio:2025.7.23-debian-12-r3
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/bitnami/minio/data

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # O .env é opcional: num clone novo a API sobe com os valores abaixo
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Dentro da rede do Compose os hosts são os nomes dos serviços, não localhost
      DATABASE_URL: postgresql+psycopg2://ouveai:ouveai@db:5432/ouveai
      MINIO_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./backend:/app

volumes:
  pgdata:
  miniodata:
