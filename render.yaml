# Blueprint do Render: sobe o protótipo inteiro (banco, API e front) no plano gratuito.
# Passo a passo na wiki, página "Como usar o protótipo". Os áudios ficam no próprio Postgres
# (STORAGE_BACKEND=database), então não é preciso contratar um S3 à parte.
databases:
  - name: ouviai-db
    plan: free
    databaseName: ouviai
    user: ouviai

services:
  - type: web
    name: ouviai-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh scripts/render_start.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ouviai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AUDIO_SIGNING_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: STORAGE_BACKEND
        value: database
      # Endereço do front. Se o Render der outro nome ao site, troque aqui e no VITE_API_URL abaixo
      - key: CORS_ORIGINS
        value: https://ouviai-web.onrender.com
      # Voz real do Azure. A chave é pedida na criação do blueprint (nunca vai para o repositório).
      # Sem chave, troque TTS_PROVIDER para "fake" (tons no lugar da voz)
      - key: TTS_PROVIDER
        value: azure
      - key: TTS_API_KEY
        sync: false
      - key: TTS_REGION
        value: brazilsouth
      - key: TTS_VOICE_ID
        value: pt-BR-ThalitaMultilingualNeural
      - key: TTS_VOICE_ID_EN
        value: en-US-AvaMultilingualNeural

  - type: web
    name: ouviai-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ouviai-api.onrender.com
    # SPA: qualquer rota (ex.: /player/1) devolve o index.html e o React Router resolve
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
